# ============================================================================
# Registry de mapas de wc3-classic-revival
# ----------------------------------------------------------------------------
# LA fuente de verdad del catalogo. Un entry por mapa; los campos desconocidos
# quedan en null (no se inventan). scripts/inspect-map.py --update-registry
# completa size_mb/slots/teams desde el .w3x sin pisar lo editado a mano.
#
# Datos de version/tamano/slots/URL: investigados y verificados con descarga
# real en EpicWar el 2026-08-08. Los tamanos estan en MiB reales del archivo.
#
# LIMITE DE TAMANO: 128 MiB (134.217.728 bytes) en el cliente objetivo 1.27b.
# 1.27a tenia un techo de 8 MiB; 1.27b lo elevo a 128 MiB. Igual la
# transferencia in-lobby es lentisima, asi que en la practica
# todo lo que pase de ~2-3 MB conviene repartirlo por map pack.
#
# return_bug_risk: riesgo de que el mapa NO cargue en 1.27b por el fix del
# return bug de JASS que introdujo el parche 1.24 (ver docs/version-juego.md):
#   verde    = formato de editor 1.24a-1.28c confirmado en EpicWar
#   amarillo = release posterior a junio 2009 (post-1.24) pero formato viejo;
#              casi seguro anda, confirmar en fase 1
#   rojo     = release pre-1.24; probar antes de publicar
#
# OJO con el campo "Game Version" de EpicWar: indica el formato del editor con
# que se guardo el mapa, NO la compatibilidad de ejecucion. Prueba: DotA 6.61b
# figura como "1.19 - 1.21b" y es notoriamente la primera compatible con 1.24.
# Por eso el criterio principal es la FECHA de release.
#
# Los mapas .w3x van en este directorio en el SERVER, nunca en git.
# ============================================================================

