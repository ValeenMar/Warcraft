# ============================================================================
# Presentacion de los lobbies: nombre en la lista de partidas + preview
# ----------------------------------------------------------------------------
# Este archivo NO describe el catalogo (eso es maps/registry.yaml). Describe
# como se VE cada mapa:
#
#   display_name  el nombre con el que se hostea la partida. Warcraft III
#                 acepta codigos de color |cAARRGGBB ... |r en el texto.
#                 LIMITE DURO: 31 bytes contando los codigos de color
#                 (aura.cpp:879 rechaza cualquier cosa mas larga). Cada
#                 "|cAARRGGBB" gasta 10 y cada "|r" gasta 2, asi que en la
#                 practica entran ~19 caracteres visibles con un color o ~15
#                 con dos. scripts/lobby-names.py valida esto.
#
#   plain_name    el mismo nombre sin colores. Es el que se usa: ver la nota
#                 de abajo.
#
#   short_name    etiqueta del jugador virtual que el bot pone en el lobby
#                 (bot_virtualhostname). LIMITE: 15 bytes contando el codigo
#                 de color, si se le pone. Sirve para saber de un vistazo que
#                 instancia hosteo la partida.
#
#   preview       tema con el que scripts/make-preview.py dibuja la imagen
#                 que reemplaza al minimapa en la pantalla de preview.
#                 Campos: title, subtitle, bg_top, bg_bottom, accent, shadow,
#                 motif. Motivos disponibles: swords, shuriken, hook, clash,
#                 orb, bolt, tower, star, none.
#
#   match         patrones glob (case-insensitive) contra el NOMBRE DE ARCHIVO
#                 del .w3x. Gana el primer entry que matchea, asi que los
#                 patrones mas especificos van primero.
#
# VERIFICADO el 2026-08-09 contra un cliente 1.27a real: la lista de partidas
# personalizadas NO pinta los codigos de color. Tampoco los muestra literales:
# se los come. O sea que "|cFF77DD44PUDGE |cFFFF3355WARS" se ve como
# "PUDGE WARS" en blanco, y los 20 bytes de los dos codigos se gastan al pedo.
# Por eso plain_name es lo que se usa por defecto, y son los nombres que da
# scripts/lobby-names.py. Los display_name quedan por si alguna vez se prueba
# otro cliente o se cambia de bot. Ver docs/presentacion.md.
# ============================================================================

lobbies:
  # ------------------------------------------------------------------ AoS ---
  - id: dota
    match: ["DotA*", "*Allstars*"]
    display_name: "|cFF00CCFFDotA |cFFFFCC006.83d"
    plain_name: "DotA Allstars 6.83d"
    short_name: "DotA"
    preview:
      title: "DotA"
      subtitle: "Allstars 6.83d"
      bg_top: "#0d2438"
      bg_bottom: "#04080f"
      accent: "#3fc4ff"
      shadow: "#01121e"
      motif: swords

  - id: pudge-wars
    match: ["Pudge Wars*", "*PudgeWars*"]
    display_name: "|cFF77DD44PUDGE |cFFFF3355WARS"
    plain_name: "Pudge Wars 1.26 - 2 equipos"
    short_name: "Pudge"
    preview:
      title: "Pudge Wars"
      subtitle: "v1.26"
      # El unico mapa del catalogo que no traia preview propia. Se le compuso
      # el render de Pudge (el personaje en el que esta basado el mapa) sobre
      # el fondo del tema. La URL sirve para rehacerlo igual:
      #   brand-map.py "Pudge Wars 1.26.w3x" --from-image "<source_image>"
      source_image: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/crops/pudge.png"
      bg_top: "#2f3d18"
      bg_bottom: "#0a0d04"
      accent: "#a8e05a"
      shadow: "#141a06"
      motif: hook

  # --------------------------------------------------------------- anime ---
  # OJO con el orden: "Anime Fight Arena" tiene que ir ANTES que
  # "Anime Fight*", si no lo captura el patron generico.
  # Hero Arena de PrideTeam (epicwar 152876, 2010). El "0.1" es solo el nombre
  # del archivo; el mapa se llama "Anime Fight Arena AI" y trae IA propia del
  # autor. No hay creeps ni oro: se sube de nivel matando a otros jugadores.
  - id: anime-fight-arena
    match: ["Anime Fight Arena*", "AnimeFightArena*"]
    display_name: "|cFFCC66FFAnime Fight Arena"
    plain_name: "Anime Fight Arena AI"
    short_name: "AF Arena"
    preview:
      title: "Arena"
      subtitle: "Anime Fight - 20 heroes"
      bg_top: "#3a1a4d"
      bg_bottom: "#0c0413"
      accent: "#d98cff"
      shadow: "#1a0726"
      motif: orb

  - id: anime-fight
    match: ["Anime Fight*", "AnimeFight*"]
    display_name: "|cFFFF3355ANIME |cFFFFCC00FIGHT"
    plain_name: "Anime Fight Beta 1.39b"
    short_name: "AnimeFight"
    preview:
