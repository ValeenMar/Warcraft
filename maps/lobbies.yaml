  # -------------------------------------------------------------- default --
  # Ultimo entry: matchea cualquier cosa. Sirve para que un mapa nuevo tenga
  # igual una preview decente antes de que le escribas su tema propio.
  - id: default
    match: ["*"]
    display_name: null   # sin tema propio no inventamos nombre: se usa el archivo
    plain_name: null
    preview:
      title: ""
      subtitle: ""
      bg_top: "#1b2436"
      bg_bottom: "#05070c"
      accent: "#8fb3d9"
      shadow: "#0a0f18"
      motif: star
