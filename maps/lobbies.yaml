  # ----------------------------------------------------------------- TD ----
  - id: marvel-td
    match: ["Marvel*", "*MarvelTD*"]
    display_name: "|cFFFFCC00MARVEL |cFF33CCFFTD"
    plain_name: "Marvel Tower Defense 1.3"
    short_name: "MarvelTD"
    preview:
      title: "Marvel TD"
      subtitle: "v1.3"
      bg_top: "#2a1030"
      bg_bottom: "#080310"
      accent: "#ffd23f"
      shadow: "#160722"
